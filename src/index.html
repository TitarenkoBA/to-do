<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Ритм</title>
  <base href="./">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="description" content="Задачи, напоминания, календарь, заметки, дневник, привычки и помодоро — офлайн">
  <meta name="theme-color" content="#f6f5fb">
  <meta name="color-scheme" content="light dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Ритм">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <script>
    // apply theme before first paint to avoid flash
    try {
      var s = JSON.parse(localStorage.getItem('ritm.settings') || '{}');
      var d = s.theme === 'dark' || ((!s.theme || s.theme === 'system') && matchMedia('(prefers-color-scheme: dark)').matches);
      if (d) document.documentElement.classList.add('dark');
      if (s.accent) document.documentElement.style.setProperty('--accent', s.accent);
    } catch (e) {}
  </script>
</head>
<body>
  <app-root></app-root>
  <noscript>Для работы Ритма нужен JavaScript.</noscript>
</body>
</html>
